user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression for faster API response transfers
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # HTTP server block: Redirects all HTTP traffic to HTTPS dynamically
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # HTTPS server block: Handles SSL termination and reverse proxying
    server {
        listen 443 ssl;
        server_name _;

        # SSL Certificates paths
        ssl_certificate /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;

        # Optimized SSL security parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Increase body size to allow high-resolution image uploads.
        client_max_body_size 20M;

        location / {
            # Forward requests to the internal Go interpretation-api container
            proxy_pass http://interpretation-api:8080;
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward the original client IP provided by Cloudflare
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

            # HTTP 1.1 support for persistent connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeouts for downstream processing
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }
    }
}
