services:
  interpretation-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interpretation-api
    restart: always
    environment:
      - PORT=8080
      - INFERENCE_API_URL=${INFERENCE_API_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - APP_URL=${APP_URL}
    # Expose port internally to other containers (like Nginx) but not directly to the host
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: interpretation-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - interpretation-api

